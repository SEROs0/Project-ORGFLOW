<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <mat-icon class="logo-icon">account_tree</mat-icon>
      <span>OrgFlow</span>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          matRipple
          class="nav-item"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar">{{ auth.currentUser()?.full_name?.charAt(0) }}</div>
        <div class="user-details">
          <span class="user-name">{{ auth.currentUser()?.full_name }}</span>
          <span class="user-role">{{ auth.currentUser()?.role }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" matRipple>
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet />
  </main>
</div>
